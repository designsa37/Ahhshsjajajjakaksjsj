<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Chess Best Move Finder ♟️</title>
<style>
* {box-sizing:border-box; font-family:system-ui,-apple-system,sans-serif; margin:0; padding:0;}
body {
  background:linear-gradient(135deg,#1e293b,#0f172a);
  min-height:100vh;
  padding:max(15px,3vw);
  color:#fff;
}
.container {
  max-width:440px;
  margin:0 auto;
  text-align:center;
}
h1 {
  font-size:clamp(1.4rem,5vw,2rem);
  margin-bottom:clamp(10px,3vw,20px);
}
.btns {
  display:flex;
  gap:10px;
  justify-content:center;
  margin:clamp(10px,3vw,18px) 0;
  flex-wrap:wrap;
}
button {
  padding:clamp(10px,2.5vw,14px) clamp(16px,4vw,24px);
  font-size:clamp(14px,3.5vw,16px);
  border:none;
  border-radius:10px;
  cursor:pointer;
  font-weight:600;
  transition:transform .15s,opacity .15s;
  touch-action:manipulation;
}
button:active {transform:scale(.96);}
button:disabled {opacity:.6; cursor:not-allowed;}
.btn-main {background:#22c55e; color:#fff;}
.btn-sec {background:#475569; color:#fff;}

.board-wrapper {
  position:relative;
  width:min(400px,95vw);
  height:min(400px,95vw);
  margin:10px auto;
  border-radius:6px;
  overflow:hidden;
  box-shadow:0 4px 20px rgba(0,0,0,0.3);
}

/* YOUR chessboard image — put your image file named "board.png" in the same folder! */
.board-bg {
  position:absolute;
  top:0; left:0;
  width:100%; height:100%;
  background-image:url('board.png');
  background-size:cover;
  background-position:center;
  z-index:1;
}

#board {
  position:absolute;
  top:0; left:0;
  width:100%; height:100%;
  z-index:2;
  background:transparent !important;
}
#board table {background:transparent !important;}
#board .square-55d63 {background:transparent !important;}

.arrows-layer {
  position:absolute;
  top:0; left:0;
  width:100%; height:100%;
  pointer-events:none;
  z-index:3;
}
.arrow-line {
  stroke:#ffcc00;
  stroke-width:6;
  marker-end:url(#arrowhead);
  opacity:0.95;
}
.arrow-head {fill:#ffcc00;}
.dot {
  fill:#ffcc00;
  opacity:0.85;
}

.result {
  margin-top:clamp(15px,4vw,24px);
  padding:clamp(14px,4vw,20px);
  background:rgba(255,255,255,.08);
  border-radius:14px;
  text-align:left;
  line-height:2;
  font-size:clamp(14px,3.5vw,16px);
}
.loading {
  display:none;
  margin-top:12px;
  color:#94a3b8;
}
.spinner {
  display:inline-block;
  width:16px; height:16px;
  border:3px solid #334155;
  border-top-color:#ffcc00;
  border-radius:50%;
  animation:spin 1s linear infinite;
  margin-right:8px;
  vertical-align:middle;
}
@keyframes spin {to{transform:rotate(360deg);}}
</style>

<script src="https://cdnjs.cloudflare.com/ajax/libs/chess.js/0.12.0/chess.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/chessboard.js/1.0.0/chessboard.min.css">
<script src="https://cdnjs.cloudflare.com/ajax/libs/chessboard.js/1.0.0/chessboard-1.0.0.min.js"></script>
</head>
<body>
<div class="container">
  <h1>♟️ Chess Best Move Finder</h1>

  <div class="btns">
    <button id="flipBtn" class="btn-sec">🔄 Flip Board</button>
    <button id="resetBtn" class="btn-sec">↩️ Reset</button>
  </div>

  <div class="board-wrapper">
    <div class="board-bg"></div>
    <div id="board"></div>
    <svg class="arrows-layer" id="arrowsLayer" viewBox="0 0 8 8" preserveAspectRatio="none">
      <defs>
        <marker id="arrowhead" markerWidth="1.2" markerHeight="0.8" refX="0.9" refY="0.4" orient="auto">
          <polygon class="arrow-head" points="0 0, 1.2 0.4, 0 0.8"/>
        </marker>
      </defs>
    </svg>
  </div>

  <div class="btns">
    <button id="calcBtn" class="btn-main">⚡ Calculate Best Move</button>
  </div>

  <div class="result">
    <strong>Current Turn:</strong> <span id="turn">White</span><br>
    <strong>Best Move:</strong> <span id="bestMove">—</span><br>
    <strong>From → To:</strong> <span id="moveFromTo">—</span><br>
    <strong>Evaluation:</strong> <span id="eval">—</span><br>
    <strong>Time:</strong> <span id="time">—</span>
  </div>
  <div class="loading" id="loading"><span class="spinner"></span>Thinking...</div>
</div>

<script>
let board, chess, engine, orientation = 'white';
chess = new Chess();

function squareToXY(square) {
  const files = 'abcdefgh';
  let x = files.indexOf(square[0]);
  let y = 8 - parseInt(square[1]);
  if (orientation === 'black') {
    x = 7 - x;
    y = 7 - y;
  }
  return {x: x + 0.5, y: y + 0.5};
}

function drawArrow(fromSquare, toSquare) {
  clearArrows();
  const from = squareToXY(fromSquare);
  const to = squareToXY(toSquare);
  const svg = document.getElementById('arrowsLayer');
  
  const dot = document.createElementNS('http://www.w3.org/2000/svg', 'circle');
  dot.setAttribute('cx', from.x);
  dot.setAttribute('cy', from.y);
  dot.setAttribute('r', '0.22');
  dot.classList.add('dot');
  svg.appendChild(dot);
  
  const line = document.createElementNS('http://www.w3.org/2000/svg', 'line');
  line.setAttribute('x1', from.x);
  line.setAttribute('y1', from.y);
  line.setAttribute('x2', to.x);
  line.setAttribute('y2', to.y);
  line.setAttribute('class', 'arrow-line');
  svg.appendChild(line);
}

function clearArrows() {
  const svg = document.getElementById('arrowsLayer');
  const defs = svg.querySelector('defs');
  svg.innerHTML = '';
  svg.appendChild(defs);
}

function initBoard() {
  if (board) board.destroy();
  board = ChessBoard('board', {
    position: 'start',
    orientation: orientation,
    draggable: true,
    onDrop: handleDrop,
    onDragStart: handleDragStart,
    showNotation: true
  });
  updateTurnDisplay();
  clearArrows();
}

function handleDragStart(source, piece) {
  const turn = chess.turn();
  if ((turn === 'w' && piece[0] !== 'w') || (turn === 'b' && piece[0] !== 'b')) return false;
}

function handleDrop(source, target) {
  const move = chess.move({from: source, to: target, promotion:'q'});
  if (move === null) return 'snapback';
  board.position(chess.fen());
  updateTurnDisplay();
  clearArrows();
}

function updateTurnDisplay() {
  document.getElementById('turn').textContent = chess.turn() === 'w' ? 'White ⬜' : 'Black ⬛';
}

async function initEngine() {
  if (engine) return;
  engine = new Worker(URL.createObjectURL(new Blob([`
    importScripts('https://cdn.jsdelivr.net/npm/stockfish.js@10.2.0/stockfish.js');
    const sf = Stockfish();
    self.onmessage = e => sf.postMessage(e.data);
    sf.onmessage = m => self.postMessage(m);
  `], {type:'application/javascript'})));
  engine.postMessage('uci');
  await waitFor('uciok');
  engine.postMessage('isready');
  await waitFor('readyok');
}

function waitFor(msg) {
  return new Promise(res => {
    const h = e => { if (e.data.includes(msg)) { engine.removeEventListener('message',h); res(); }};
    engine.addEventListener('message', h);
  });
}

async function calculateBestMove() {
  const calcBtn = document.getElementById('calcBtn');
  const loading = document.getElementById('loading');
  const startTime = performance.now();

  calcBtn.disabled = true;
  loading.style.display = 'block';
  document.getElementById('bestMove').textContent = '—';
  document.getElementById('moveFromTo').textContent = '—';
  document.getElementById('eval').textContent = '—';
  document.getElementById('time').textContent = '—';
  clearArrows();

  await initEngine();
  engine.postMessage(`position fen ${chess.fen()}`);
  engine.postMessage('go depth 18');

  let bestMove = null, evalScore = null;

  const handler = e => {
    if (e.data.startsWith('info')) {
      const cpMatch = e.data.match(/score cp (-?\d+)/);
      const mateMatch = e.data.match(/score mate (-?\d+)/);
      if (cpMatch) evalScore = parseInt(cpMatch[1]) / 100;
      if (mateMatch) evalScore = `Mate in ${Math.abs(parseInt(mateMatch[1]))}`;
    }
    if (e.data.startsWith('bestmove')) {
      bestMove = e.data.split(' ')[1];
      engine.removeEventListener('message', handler);
      finish(bestMove, evalScore, Math.round(performance.now() - startTime));
    }
  };
  engine.addEventListener('message', handler);

  function finish(move, eval, timeMs) {
    const from = move.slice(0,2);
    const to = move.slice(2,4);
    const tempChess = new Chess(chess.fen());
    const moveSan = tempChess.move({from, to, promotion:'q'}).san;

    document.getElementById('bestMove').textContent = moveSan;
    document.getElementById('moveFromTo').textContent = `${from} → ${to}`;
    document.getElementById('eval').textContent = typeof eval === 'number' ? `${eval.toFixed(2)} pawns` : eval;
    document.getElementById('time').textContent = `${timeMs}ms`;

    drawArrow(from, to);

    loading.style.display = 'none';
    calcBtn.disabled = false;
  }
}

document.getElementById('flipBtn').onclick = () => {
  orientation = orientation === 'white' ? 'black' : 'white';
  board.orientation(orientation);
  clearArrows();
};

document.getElementById('resetBtn').onclick = () => {
  chess.reset();
  initBoard();
  document.getElementById('bestMove').textContent = '—';
  document.getElementById('moveFromTo').textContent = '—';
  document.getElementById('eval').textContent = '—';
  document.getElementById('time').textContent = '—';
};

document.getElementById('calcBtn').onclick = calculateBestMove;

window.addEventListener('load', initBoard);
</script>
</body>
</html>
